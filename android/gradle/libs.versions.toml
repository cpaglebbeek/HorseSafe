# HorseSafe Android (0.3.0-Miller deel 1, 0.3.4-Miller deel 2). Sjabloon: HorseAPK/android.
# Bewust GEEN netwerkbibliotheken (geen okhttp/retrofit/ktor): deel 2 (telefoon koppelen) gebruikt de
# platform-HttpsURLConnection in net/, alleen naar icthorsecloud.nl (network-security-config met pins).
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.11.00"
kotlinxCoroutines = "1.9.0"
# yubikit 3.0.1 gepind; 3.1 / 3.2.x pas na een Kotlin-upgrade naar 2.2.
# SHA-256 van de vier artefacten wordt gecontroleerd door :app:verifyYubikitHashes.
yubikit = "3.0.1"
junit = "4.13.2"
# Deel 2 (HARDWARE_KEYS §7.2): biometrie (alleen BIOMETRIC_STRONG + CryptoObject) en QR-scanner zonder GMS.
biometric = "1.2.0-alpha05"
fragmentKtx = "1.8.5"
# zxing-android-embedded 4.3.0 met zijn eigen core-versie 3.4.1; SHA-256 van beide gecontroleerd door
# :app:verifyZxingHashes (zelfde patroon als yubikit).
zxingEmbedded = "4.3.0"
zxingCore = "3.4.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
yubikit-android = { group = "com.yubico.yubikit", name = "android", version.ref = "yubikit" }
yubikit-core = { group = "com.yubico.yubikit", name = "core", version.ref = "yubikit" }
yubikit-fido = { group = "com.yubico.yubikit", name = "fido", version.ref = "yubikit" }
yubikit-management = { group = "com.yubico.yubikit", name = "management", version.ref = "yubikit" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
zxing-android-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxingEmbedded" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxingCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
